name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git unzip openjdk-11-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev curl
        
    - name: Install Buildozer and dependencies
      run: |
        pip install buildozer cython virtualenv
        
    - name: Build APK
      run: |
        # 跳过clean步骤，直接构建
        buildozer -v android debug
        
    - name: List built APK
      run: |
        ls -la bin/
        
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: shuangseqiu-apk
        path: bin/*.apk
        retention-days: 7
        path: bin/*.apk
        retention-days: 7
